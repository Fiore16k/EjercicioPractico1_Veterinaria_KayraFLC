spring.application.name=gestionveterinaria



spring.datasource.url=jdbc:mysql://localhost:3306/veterinaria_citas
spring.datasource.username=usuario_caso_practico_01_var
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Para definir el puerto del server
server.port=8086

#Se define el formato de fecha/hora del log del servidor web
logging.pattern.dateformat=HH:mm:ss

#Se define no presentar el banner de SPRING en el log del servidor
spring.main.banner-mode=off

#Se evita el uso de cache en desarrollo en producción si se debe usar.
spring.thymeleaf.cache=false
