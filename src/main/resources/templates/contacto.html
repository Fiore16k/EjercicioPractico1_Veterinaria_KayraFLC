<html>
    <head>
        <title>Veterinaria Mr.Firulais</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contacto</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/estilos.css}">
    </head>
    <body class="bg-light">

    <nav class="navbar navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">Clínica Veterinaria</a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-body">
                <h2>Contactanos</h2>
                <p>Dejanos tus datos y tu consulta.</p>

                <form th:action="@{/contacto}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="nombre" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" name="correo" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nombre de la mascota</label>
                        <input type="text" name="mascota" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mensaje</label>
                        <textarea name="mensaje" class="form-control"
                                  rows="4" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-success">Enviar</button>
                    <a th:href="@{/}" class="btn btn-secondary">Volver</a>
                </form>
            </div>
        </div>
    </div>

    </body>
    </html>
