<html>
    <head>
        <title>TODO supply a title</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Servicios veterinarios</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">

    <nav class="navbar navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">Clínica Veterinaria</a>
            <a class="btn btn-light" th:href="@{/}">Inicio</a>
        </div>
    </nav>

    <div class="container py-4">
        <h1>Servicios veterinarios</h1>

        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

        <a class="btn btn-success mb-3" th:href="@{/servicios/nuevo}">
            Agregar servicio
        </a>

        <div class="table-responsive">
            <table class="table table-bordered table-striped bg-white">
                <thead class="table-success">
                    <tr>
                        <th>Nombre</th>
                        <th>Tipo de servicio</th>
                        <th>Precio</th>
                        <th>Duración (minutos)</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="servicio : ${servicios}">
                        <td th:text="${servicio.nombre}"></td>
                        <td th:text="${servicio.tipoServicio.nombre}"></td>
                        <td th:text="${servicio.precio}"></td>
                        <td th:text="${servicio.duracionMinutos}"></td>
                        <td>
                            <a class="btn btn-warning btn-sm"
                               th:href="@{/servicios/editar/{id}(id=${servicio.id})}">
                                Editar
                            </a>

                            <form th:action="@{/servicios/eliminar/{id}(id=${servicio.id})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('¿Desea eliminar este servicio?');">
                                <button class="btn btn-danger btn-sm" type="submit">
                                    Eliminar
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(servicios)}">
                        <td colspan="5" class="text-center">
                            No hay servicios registrados.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer class="bg-success text-white text-center p-3">
        Clínica Veterinaria
    </footer>

    </body>
    </html>
