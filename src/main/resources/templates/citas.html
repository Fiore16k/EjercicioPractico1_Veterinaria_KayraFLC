<html>
    <head>
        <title>Veterinaria Mr.Firulais</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Citas veterinarias</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/estilos.css}">
    </head>
    <body class="bg-light">

    <nav class="navbar navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">Clínica Veterinaria</a>
            <a class="btn btn-light" th:href="@{/}">Inicio</a>
        </div>
    </nav>

    <div class="container py-4">
        <h1>Citas registradas</h1>

        <table class="table table-bordered table-striped bg-white mt-3">
            <thead class="table-success">
                <tr>
                    <th>Mascota</th>
                    <th>Propietario</th>
                    <th>Fecha</th>
                    <th>Servicio</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cita : ${citas}">
                    <td th:text="${cita.nombreMascota}"></td>
                    <td th:text="${cita.nombrePropietario}"></td>
                    <td th:text="${cita.fecha}"></td>
                    <td th:text="${cita.servicio.nombre}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(citas)}">
                    <td colspan="4" class="text-center">
                        No hay citas registradas.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <footer class="bg-success text-white text-center p-3">
        Clínica Veterinaria
    </footer>

    </body>
    </html>
