<html>
    <head>
        <title>Veterinaria Mr.Firulais</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tipo de servicio</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">    
        <link rel="stylesheet" th:href="@{/css/estilos.css}">
    </head>
    <body>

    <nav class="navbar navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">Clínica Veterinaria</a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="card mx-auto shadow-sm" style="max-width: 600px;">
            <div class="card-body">
                <h2 class="mb-4">Registrar o editar tipo de servicio</h2>

                <form th:action="@{/tipos-servicio/guardar}"
                      th:object="${tipoServicio}" method="post">

                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control"
                               th:field="*{nombre}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea class="form-control"
                                  th:field="*{descripcion}" rows="3"></textarea>
                    </div>

                    <button type="submit" class="btn btn-success">Guardar</button>
                    <a th:href="@{/tipos-servicio}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>

    </body>
    </html>
