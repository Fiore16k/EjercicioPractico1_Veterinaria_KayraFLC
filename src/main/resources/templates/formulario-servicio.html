<html>
    <head>
        <title>Veterinaria Mr.Firulais</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulario de servicio</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">        
        <link rel="stylesheet" th:href="@{/css/estilos.css}">
    </head>
    <body>

    <nav class="navbar navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">Clínica Veterinaria: Mr. Firulais</a>
        </div>
    </nav>

    <div class="container py-4">
        <div class="card shadow-sm mx-auto" style="max-width: 650px;">
            <div class="card-body">
                <h2 class="mb-4">Registrar o editar servicio</h2>

                <form th:action="@{/servicios/guardar}"
                      th:object="${servicio}" method="post">

                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label">Nombre del servicio</label>
                        <input type="text" class="form-control"
                               th:field="*{nombre}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Precio</label>
                        <input type="number" class="form-control"
                               th:field="*{precio}" min="0.01" step="0.01" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Duración en minutos</label>
                        <input type="number" class="form-control"
                               th:field="*{duracionMinutos}" min="1" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Tipo de servicio</label>
                        <select class="form-select" th:field="*{tipoServicio}" required>
                            <option value="">Seleccione un tipo</option>
                            <option th:each="tipo : ${tiposServicio}"
                                    th:value="${tipo.id}"
                                    th:text="${tipo.nombre}">
                            </option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-success">Guardar</button>
                    <a th:href="@{/servicios}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>

    </body>
    </html>
